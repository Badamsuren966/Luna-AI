<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNA AI</title>
<style>
body {
  background: #071426;
  color: #69baff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 100px;
}
.status {
  font-size: 24px;
  margin-bottom: 35px;
}
button {
  background: #12365c;
  color: #8bd0ff;
  border: 1px solid #69baff;
  padding: 18px 35px;
  border-radius: 12px;
  font-size: 18px;
}
</style>
</head>
<body>

<div class="status" id="status">SYSTEM ONLINE</div>
<button onclick="activate()">ACTIVATE LUNA</button>
<div class="footer">PERSONAL AI SYSTEM · VERSION 0.3</div>

<script>
let active = false;
let recognition;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    let text =
      event.results[event.results.length - 1][0].transcript;
    document.getElementById("status").textContent =
      "You said: " + text;
  };

  recognition.onend = function() {
    if (active) recognition.start();
  };

  recognition.onerror = function() {
    document.getElementById("status").textContent =
      "Microphone error";
  };
}

function activate() {
  if (!recognition) {
    document.getElementById("status").textContent =
      "Speech recognition not supported";
    return;
  }

  active = !active;

  if (active) {
    document.getElementById("status").textContent =
      "Listening...";
    recognition.start();
  } else {
    recognition.stop();
    document.getElementById("status").textContent =
      "SYSTEM ONLINE";
  }
}
</script>

</body>
</html>
