<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L.U.N.A. AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #102b55 0%, #071426 45%, #020711 100%);
  color: #dceeff;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

h1 {
  letter-spacing: 9px;
  font-size: 32px;
  margin-bottom: 8px;
  text-shadow: 0 0 20px #168cff;
}

.subtitle {
  font-size: 10px;
  letter-spacing: 4px;
  color: #7da9d5;
}

.orb-area {
  width: 260px;
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 35px 0;
}

.orb {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 30%,
    #b5f5ff,
    #168cff 25%,
    #0751a5 55%,
    #03152f 78%
  );
  box-shadow:
    0 0 25px #168cff,
    0 0 65px #087bff,
    inset 0 0 25px #9cecff;
  animation: pulse 3s infinite ease-in-out;
  transition: 0.4s;
}

.orb::before {
  content: "";
  position: absolute;
  width: 210px;
  height: 210px;
  border: 1px solid #168cff66;
  border-radius: 50%;
  transform: translate(-32px, -32px);
  animation: rotate 12s linear infinite;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(0.92);
    filter: brightness(0.85);
  }
  50% {
    transform: scale(1.08);
    filter: brightness(1.35);
  }
}

@keyframes rotate {
  to { transform: translate(-32px, -32px) rotate(360deg); }
}

.status {
  color: #63caff;
  letter-spacing: 4px;
  font-size: 12px;
  margin-bottom: 25px;
}

button {
  background: #0c3766;
  color: white;
  border: 1px solid #249dff;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 0 18px #087bff55;
}

button:hover {
  background: #14528c;
}

.footer {
  position: fixed;
  bottom: 20px;
  color: #54799f;
  font-size: 10px;
  letter-spacing: 3px;
}
</style>
</head>

<body>

<h1>L.U.N.A.</h1>
<div class="subtitle">
LOGICAL UNDERSTANDING NEURAL ASSISTANT
</div>

<div class="orb-area">
  <div class="orb" id="orb"></div>
</div>

<div class="status" id="status">
SYSTEM ONLINE
</div>

<button onclick="activateLuna()">
ACTIVATE LUNA
</button>

<div class="footer">
PERSONAL AI SYSTEM
</div>

<script>
let active = false;

function activateLuna() {
  const status = document.getElementById("status");
  const orb = document.getElementById("orb");

  active = !active;

  if (active) {
    status.textContent = "LUNA READY";
    orb.style.filter = "brightness(1.5)";
    orb.style.transform = "scale(1.12)";
  } else {
    status.textContent = "SYSTEM ONLINE";
    orb.style.filter = "brightness(1)";
    orb.style.transform = "scale(1)";
  }
}
</script>

</body>
</html>
